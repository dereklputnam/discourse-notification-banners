banners:
  refresh: true
  default: []
  type: objects
  schema:
    name: Banner message
    identifier: id
    properties:
      id:
        type: string
        required: true
      enabled_groups:
        type: groups
        required: true
        default: [0]
        resolve_group_membership: true
        validations:
          min: 1
      selected_categories:
        type: categories
      include_subcategories:
        type: boolean
      icon:
        type: enum
        default: ""
        choices:
          - ""
          - "bell"
          - "bookmark"
          - "calendar-days"
          - "circle-info"
          - "envelope"
          - "flag"
          - "heart"
          - "lock"
          - "magnifying-glass"
          - "bullhorn"
          - "pencil"
          - "shield-halved"
          - "star"
          - "tag"
          - "triangle-exclamation"
          - "wrench"
      title:
        type: string
      message:
        type: string
        required: true
        validations:
          min_length: 15
          max_length: 500
      event_start:
        type: datetime
      event_end:
        type: datetime
      event_topic:
        type: string
      soon_message:
        type: string
        validations:
          max_length: 500
      live_title:
        type: string
      live_message:
        type: string
        validations:
          max_length: 500
      plugin_outlet:
        type: enum
        required: true
        default: "above-main-container"
        choices:
          - "above-site-header"
          - "below-site-header"
          - "above-main-container"
          - "before-sidebar-sections"
          - "top-notices"
      carousel:
        type: boolean
      dismissible:
        type: boolean
      date_after:
        type: datetime
      date_before:
        type: datetime

event_live_duration_minutes:
  type: integer
  default: 30
  min: 5
  max: 240
  description: "How long an event banner shows its live message after the event starts when the banner has no end time."
  refresh: true

event_soon_minutes:
  type: integer
  default: 5
  min: 1
  max: 30
  description: "How many minutes before an event starts its banner switches to the Soon message (only for banners that have one)."
  refresh: true

banner_config_version:
  type: string
  default: "2025-11-04"
  min: 3
  max: 15
  description: "When important changes are made to the banners, you must change this value to reset the banner visibility. This change ensures all your users see previously dismissed banners."
  refresh: true

splide_options__above_site_header:
  type: string
  default: '{ "autoHeight": true, "height": "8rem", "arrows": false, "autoplay": true, "direction": "ttb", "focus": "center", "gap": 0, "type": "loop" }'
  description: '<a href="https://splidejs.com/guides/options/" target="_blank">Splide options</a> for banners above the site header'
  textarea: true
  refresh: true
splide_options__below_site_header:
  type: string
  default: '{ "autoHeight": true, "height": "8rem", "arrows": false, "autoplay": true, "direction": "ttb", "focus": "center", "gap": 0, "type": "loop" }'
  description: '<a href="https://splidejs.com/guides/options/" target="_blank">Splide options</a> for banners below the site header'
  textarea: true
  refresh: true
splide_options__above_main_container:
  type: string
  default: "{ \"autoHeight\": true, \"height\": \"8rem\", \"arrows\": false, \"autoplay\": true, \"direction\": \"ttb\", \"focus\": \"center\", \"gap\": 0, \"type\": \"loop\" }"
  description: "<a href=\"https://splidejs.com/guides/options/\" target=\"_blank\">Splide options</a> for banners above the main container"
  textarea: true
  refresh: true
splide_options__before_sidebar_sections:
  type: string
  default: "{ \"autoHeight\": true, \"height\": \"8rem\", \"arrows\": false, \"autoplay\": true, \"direction\": \"ttb\", \"focus\": \"center\", \"gap\": 0, \"type\": \"loop\" }"
  description: "<a href=\"https://splidejs.com/guides/options/\" target=\"_blank\">Splide options</a> for banners in the sidebar"
  textarea: true
  refresh: true
splide_options__top_notices:
  type: string
  default: '{ "autoHeight": true, "height": "8rem", "arrows": false, "autoplay": true, "direction": "ttb", "focus": "center", "gap": 0, "type": "loop" }'
  description: '<a href="https://splidejs.com/guides/options/" target="_blank">Splide options</a> for banners in top notices'
  textarea: true
  refresh: true
